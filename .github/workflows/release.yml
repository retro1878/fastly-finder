name: Release Binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests
        run: go test -v ./...

      - name: Build Linux binaries
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o dist/fastly-finder-linux-amd64 .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o dist/fastly-finder-linux-arm64 .

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fastly-finder-linux
          path: dist/

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" dist/fastly-finder-linux-amd64 dist/fastly-finder-linux-arm64 \
            --title "$TAG" --generate-notes || \
          gh release upload "$TAG" dist/fastly-finder-linux-amd64 dist/fastly-finder-linux-arm64 --clobber
