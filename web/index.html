<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>fastly-finder</title>
<style>
  :root{
    --bg:#0b101b;--panel:#111827;--panel2:#172033;--border:#243047;
    --text:#e5ecf6;--muted:#8b9bb4;--accent:#ff282d;--accent2:#ff5c60;
    --ok:#22c55e;--warn:#f59e0b;--bad:#ef4444;--info:#38bdf8;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
    --sans:Vazirmatn,Tahoma,system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.55}
  .hidden{display:none!important}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:16px;flex-wrap:wrap}
  .header-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);flex-shrink:0}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--border);color:var(--muted)}
  .pill.ok{color:#86efac;border-color:#166534;background:#052e16}
  .pill.warn{color:#fde68a;border-color:#854d0e;background:#291a03}
  .pill.bad{color:#fca5a5;border-color:#991b1b;background:#2b0909}
  .pill.info{color:#7dd3fc;border-color:#075985;background:#082235}
  main{max-width:1360px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
  main>*{min-width:0}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;min-width:0}
  .row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
  .col{display:flex;flex-direction:column;gap:6px;flex:1;min-width:180px}
  .num-col{flex:0 1 180px;min-width:140px;max-width:210px}
  .checks-inline{padding-top:18px;flex:1 1 320px;min-width:0}
  .actions-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
  #statusMsg{flex:1 1 200px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted)}
  label{font-size:12px;color:var(--muted);display:inline-flex;align-items:center;gap:5px}
  input[type=text],input[type=password],input[type=number],select,textarea{
    background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:7px;
    padding:8px 10px;font-family:inherit;font-size:13px;outline:none;max-width:100%
  }
  input[type=number],input.ltr,textarea.ltr{direction:ltr;text-align:left}
  input:focus,select:focus,textarea:focus{border-color:var(--info)}
  textarea{min-height:86px;font-family:var(--mono);font-size:12px;resize:vertical}
  button{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:7px;
    padding:8px 14px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;transition:.15s
  }
  button:hover:not(:disabled){border-color:#3b4f73;background:#1e293d}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  button.primary:hover:not(:disabled){background:var(--accent2)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .lang-btn{padding:5px 10px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;border-bottom:1px solid var(--border);padding-bottom:10px}
  .tab{background:transparent;border:1px solid transparent;color:var(--muted);padding:6px 12px}
  .tab.active{background:var(--panel2);border-color:var(--border);color:var(--text)}
  .checks{display:flex;flex-wrap:wrap;gap:8px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text);background:var(--bg);border:1px solid var(--border);padding:5px 10px;border-radius:7px;cursor:pointer;user-select:none}
  .chk:hover{border-color:#3b4f73}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;min-width:0}
  .kpi{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 14px;transition:border-color .15s;min-width:0}
  .kpi:hover{border-color:#3b4f73}
  .kpi .lbl{font-size:11px;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .kpi .val{font-size:22px;font-weight:700;margin-top:4px;font-family:var(--mono);direction:ltr;text-align:start;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .progress-wrap{height:8px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--border);margin:10px 0}
  .progress-bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),#fb923c);transition:width .25s}
  .logs{background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:10px;font-family:var(--mono);font-size:11.5px;max-height:140px;overflow:auto;color:#b6c3d8;white-space:pre-wrap;direction:ltr;text-align:left}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px}
  .toolbar-group{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:1 1 auto;min-width:0}
  .search-input{flex:1 1 240px;min-width:0}
  .files-select{flex:1 1 210px;min-width:0;max-width:340px}
  .exp-btns{display:flex;gap:6px;flex-wrap:wrap}
  .table-wrap{overflow:auto;border:1px solid var(--border);border-radius:8px;max-height:540px;width:100%;max-width:100%}
  table{width:100%;min-width:860px;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
  th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  td .pill{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle}
  th{background:var(--panel2);color:var(--muted);font-weight:600;position:sticky;top:0;z-index:5}
  th[data-tip]{cursor:help}
  tbody tr{cursor:pointer}
  tbody tr:hover{background:#162033}
  .mono{font-family:var(--mono);direction:ltr;unicode-bidi:isolate}
  .ltr-cell{direction:ltr;unicode-bidi:isolate}
  [dir="rtl"] .ltr-cell,[dir="rtl"] td.mono{text-align:right}
  #loginWrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
  #loginCard{width:100%;max-width:380px}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;max-width:780px;width:100%;max-height:85vh;display:flex;flex-direction:column}
  .modal-head{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border)}
  .modal-body{padding:16px;overflow:auto}
  pre{margin:0;background:var(--bg);border:1px solid var(--border);border-radius:7px;padding:12px;font-family:var(--mono);font-size:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;direction:ltr;text-align:left}
  .tip-badge{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;border:1px solid #354666;color:#9ab0d1;font-size:10px;font-weight:700;line-height:1;opacity:.85;flex-shrink:0}
  #hoverTip{
    position:fixed;z-index:100;max-width:min(380px,calc(100vw - 20px));padding:9px 12px;border-radius:8px;
    background:#0c1424;border:1px solid #38507a;color:#e8effa;font-size:12px;line-height:1.5;
    box-shadow:0 12px 28px rgba(0,0,0,.55);pointer-events:none;opacity:0;transform:translateY(3px);
    transition:opacity .12s ease,transform .12s ease;white-space:normal;overflow-wrap:anywhere
  }
  #hoverTip.visible{opacity:1;transform:translateY(0)}
  #hoverTip.mono-tip{font-family:var(--mono);direction:ltr;text-align:left;unicode-bidi:plaintext}
  @media (max-width: 900px){
    .num-col{flex:1 1 160px;max-width:none}
    .checks-inline{padding-top:0;flex-basis:100%}
    .toolbar-group{flex:1 1 100%}
  }
  @media (max-width: 640px){
    header{padding:10px 14px}
    .header-actions{width:100%;justify-content:space-between}
    main{padding:10px;gap:12px}
    .card{padding:12px;border-radius:9px}
    .tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
    .tab{padding:7px 6px;font-size:12px;text-align:center}
    .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .kpi{padding:10px}
    .kpi:last-child{grid-column:1 / -1}
    .num-col{flex:1 1 calc(50% - 6px);min-width:120px}
    .actions-row button{flex:1 1 120px}
    .search-input,.files-select,#statusFilter{width:100%;flex:1 1 100%;max-width:none}
    .exp-btns{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
    .modal-bg{padding:10px}
    .modal{max-height:92vh}
  }
</style>
</head>
<body>

<div id="loginWrap" class="hidden">
  <div id="loginCard" class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:14px">
      <div class="brand"><span class="dot"></span><span>fastly-finder</span><span class="pill ok">HTTPS</span></div>
      <button id="loginLangBtn" class="lang-btn" type="button" data-tip="tip_lang">EN / فارسی</button>
    </div>
    <form id="loginForm" class="col">
      <label for="loginUser" data-tip="tip_login_user"><span data-i18n="username">نام کاربری</span><span class="tip-badge">?</span></label>
      <input id="loginUser" class="ltr" type="text" autocomplete="username" value="admin" data-tip="tip_login_user" required>
      <label for="loginPass" data-tip="tip_login_pass"><span data-i18n="password">رمز عبور</span><span class="tip-badge">?</span></label>
      <input id="loginPass" class="ltr" type="password" autocomplete="current-password" data-tip="tip_login_pass" required>
      <div id="loginErr" style="color:#fca5a5;font-size:12px;min-height:16px"></div>
      <button class="primary" type="submit" data-i18n="sign_in">ورود به داشبورد</button>
    </form>
  </div>
</div>

<div id="appWrap" class="hidden">
  <header>
    <div class="brand">
      <span class="dot"></span>
      <span>fastly-finder</span>
      <span class="pill ok">HTTPS</span>
      <span id="runStatePill" class="pill" data-tip="tip_run_state">idle</span>
    </div>
    <div class="header-actions">
      <button id="langBtn" class="lang-btn" type="button" data-tip="tip_lang">EN / فارسی</button>
      <span id="userLabel" class="pill"></span>
      <button id="logoutBtn" type="button" data-i18n="logout" data-tip="tip_logout">خروج</button>
    </div>
  </header>

  <main>
    <section class="card">
      <div class="tabs">
        <button type="button" class="tab active" data-mode="domain" data-i18n="mode_domain" data-tip="tip_mode_domain">دامنه هدف</button>
        <button type="button" class="tab" data-mode="global" data-i18n="mode_global" data-tip="tip_mode_global">جستجوی سراسری</button>
        <button type="button" class="tab" data-mode="hosts" data-i18n="mode_hosts" data-tip="tip_mode_hosts">فهرست هاست</button>
      </div>

      <div id="panelDomain" class="col" style="margin-bottom:12px">
        <label for="domainInput" data-tip="tip_domain_input"><span data-i18n="lbl_domain">دامنه‌های هدف (جداشده با کاما)</span><span class="tip-badge">?</span></label>
        <input id="domainInput" class="ltr" type="text" placeholder="reddit.com, fastly.com" data-tip="tip_domain_input">
      </div>

      <div id="panelGlobal" class="hidden" style="margin-bottom:12px">
        <label style="margin-bottom:6px" data-tip="tip_seeds_group"><span data-i18n="lbl_seeds">منابع رایگان (بدون هزینه)</span><span class="tip-badge">?</span></label>
        <div class="checks" id="seedChecks" style="margin-bottom:12px">
          <label class="chk" data-tip="tip_seed_crux"><input type="checkbox" value="crux" checked> crux <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_seed_chaos"><input type="checkbox" value="chaos" checked> chaos <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_seed_tranco"><input type="checkbox" value="tranco"> tranco <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_seed_umbrella"><input type="checkbox" value="umbrella"> umbrella <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_seed_majestic"><input type="checkbox" value="majestic"> majestic <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_seed_ct_fastly"><input type="checkbox" value="ct-fastly" checked> ct-fastly <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_seed_ct_logs"><input type="checkbox" value="ct-logs"> ct-logs <span class="tip-badge">?</span></label>
        </div>
        <div class="row">
          <div class="col num-col">
            <label for="limitInput" data-tip="tip_limit"><span data-i18n="lbl_limit">سقف هر منبع (0 = همه)</span><span class="tip-badge">?</span></label>
            <input id="limitInput" type="number" min="0" value="20000" data-tip="tip_limit">
          </div>
          <div class="col num-col">
            <label for="ctEntriesInput" data-tip="tip_ct_entries"><span data-i18n="lbl_ct_entries">گواهی‌های اخیر هر CT Log</span><span class="tip-badge">?</span></label>
            <input id="ctEntriesInput" type="number" min="100" value="5000" data-tip="tip_ct_entries">
          </div>
        </div>
      </div>

      <div id="panelHosts" class="hidden col" style="margin-bottom:12px">
        <label for="hostsInput" data-tip="tip_hosts_input"><span data-i18n="lbl_hosts">نام‌های میزبان (هر خط یک هاست)</span><span class="tip-badge">?</span></label>
        <textarea id="hostsInput" class="ltr" placeholder="www.reddit.com&#10;docs.fastly.com" data-tip="tip_hosts_input"></textarea>
      </div>

      <div class="row" style="margin-bottom:12px">
        <div class="col num-col">
          <label for="dnsWorkersInput" data-tip="tip_dns_workers"><span data-i18n="lbl_dns_workers">کارگرهای همزمان DNS</span><span class="tip-badge">?</span></label>
          <input id="dnsWorkersInput" type="number" min="1" max="1000" value="150" data-tip="tip_dns_workers">
        </div>
        <div class="col num-col">
          <label for="httpWorkersInput" data-tip="tip_http_workers"><span data-i18n="lbl_http_workers">کارگرهای همزمان HTTP</span><span class="tip-badge">?</span></label>
          <input id="httpWorkersInput" type="number" min="1" max="500" value="40" data-tip="tip_http_workers">
        </div>
        <div class="checks checks-inline">
          <label class="chk" data-tip="tip_with_www"><input id="withWWWCheck" type="checkbox" checked> <span data-i18n="chk_www">افزودن www.</span> <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_doh"><input id="dohCheck" type="checkbox"> <span data-i18n="chk_doh">DNS از مسیر DoH</span> <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_bgp"><input id="bgpCheck" type="checkbox"> <span data-i18n="chk_bgp">رنج‌های BGP</span> <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_skip_probe"><input id="skipProbeCheck" type="checkbox"> <span data-i18n="chk_dns_only">فقط بررسی DNS</span> <span class="tip-badge">?</span></label>
          <label class="chk" data-tip="tip_only_confirmed"><input id="onlyConfirmedCheck" type="checkbox"> <span data-i18n="chk_only_confirmed">فقط موارد تأییدشده</span> <span class="tip-badge">?</span></label>
        </div>
      </div>

      <div class="actions-row">
        <button id="startBtn" class="primary" type="button" data-i18n="btn_start" data-tip="tip_start">شروع اسکن</button>
        <button id="cancelBtn" type="button" disabled data-i18n="btn_cancel" data-tip="tip_cancel">توقف</button>
        <span id="statusMsg" class="mono"></span>
      </div>

      <div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div>
      <div id="logsBox" class="logs" data-tip="tip_logs">آماده.</div>
    </section>

    <section class="kpis">
      <div class="kpi" data-tip="tip_kpi_confirmed"><div class="lbl"><span data-i18n="kpi_confirmed">تأییدشده (Confirmed)</span><span class="tip-badge">?</span></div><div id="kpiConfirmed" class="val" style="color:var(--ok)">0</div></div>
      <div class="kpi" data-tip="tip_kpi_hidden"><div class="lbl"><span data-i18n="kpi_hidden">هدر مخفی</span><span class="tip-badge">?</span></div><div id="kpiHidden" class="val" style="color:var(--info)">0</div></div>
      <div class="kpi" data-tip="tip_kpi_unknown"><div class="lbl"><span data-i18n="kpi_unknown">دامنه ثبت‌نشده</span><span class="tip-badge">?</span></div><div id="kpiUnknown" class="val" style="color:var(--warn)">0</div></div>
      <div class="kpi" data-tip="tip_kpi_unreach"><div class="lbl"><span data-i18n="kpi_unreach">غیرقابل‌دسترس</span><span class="tip-badge">?</span></div><div id="kpiUnreach" class="val" style="color:var(--bad)">0</div></div>
      <div class="kpi" data-tip="tip_kpi_cand"><div class="lbl"><span data-i18n="kpi_cand">کاندید / تطبیق DNS</span><span class="tip-badge">?</span></div><div id="kpiCand" class="val">0 / 0</div></div>
    </section>

    <section class="card">
      <div class="toolbar">
        <div class="toolbar-group">
          <input id="searchInput" class="search-input" type="text" data-i18n-ph="ph_search" placeholder="جستجو در هاست، IP، CNAME، POP، صادرکننده، منبع..." data-tip="tip_search">
          <select id="statusFilter" data-tip="tip_status_filter">
            <option value="" data-i18n="opt_all">همه وضعیت‌ها</option>
            <option value="confirmed">confirmed</option>
            <option value="fastly_dns_headers_hidden">fastly_dns_headers_hidden</option>
            <option value="unknown_domain">unknown_domain</option>
            <option value="dns_only_unreachable">dns_only_unreachable</option>
            <option value="edge_configured_off_dns">edge_configured_off_dns</option>
            <option value="fastly_dns">fastly_dns</option>
          </select>
          <label class="chk" data-tip="tip_sni_filter"><input id="sniOnlyCheck" type="checkbox"> <span data-i18n="chk_sni_only">تطبیق گواهی SNI</span> <span class="tip-badge">?</span></label>
        </div>
        <div class="toolbar-group" style="justify-content:flex-end">
          <select id="savedFilesSelect" class="files-select" data-tip="tip_saved_files">
            <option value="" data-i18n="opt_current">اسکن جاری / فعال</option>
          </select>
          <div class="exp-btns">
            <button type="button" data-exp="jsonl" data-tip="tip_exp_jsonl">JSONL</button>
            <button type="button" data-exp="csv" data-tip="tip_exp_csv">CSV</button>
            <button type="button" data-exp="txt" data-tip="tip_exp_txt">TXT</button>
          </div>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <colgroup>
            <col style="width:19%">
            <col style="width:13%">
            <col style="width:6%">
            <col style="width:6%">
            <col style="width:12%">
            <col style="width:16%">
            <col style="width:12%">
            <col style="width:9%">
            <col style="width:7%">
          </colgroup>
          <thead>
            <tr>
              <th data-tip="tip_col_host" data-i18n="col_host">هاست</th>
              <th data-tip="tip_col_status" data-i18n="col_status">وضعیت</th>
              <th data-tip="tip_col_http" data-i18n="col_http">HTTP</th>
              <th data-tip="tip_col_sni" data-i18n="col_sni">SNI</th>
              <th data-tip="tip_col_ip" data-i18n="col_ip">IP فستلی</th>
              <th data-tip="tip_col_cname" data-i18n="col_cname">CNAME</th>
              <th data-tip="tip_col_pop" data-i18n="col_pop">X-Served-By</th>
              <th data-tip="tip_col_issuer" data-i18n="col_issuer">صادرکننده TLS</th>
              <th data-tip="tip_col_sources" data-i18n="col_sources">منابع</th>
            </tr>
          </thead>
          <tbody id="resultsBody"></tbody>
        </table>
      </div>
      <div id="tableNotice" class="hidden" style="font-size:12px;color:var(--muted);margin-top:8px"></div>
    </section>
  </main>
</div>

<div id="detailModal" class="modal-bg hidden">
  <div class="modal">
    <div class="modal-head">
      <strong id="detailTitle" class="mono"></strong>
      <button id="closeModalBtn" type="button" data-i18n="btn_close">بستن</button>
    </div>
    <div class="modal-body">
      <pre id="detailJson"></pre>
    </div>
  </div>
</div>

<div id="hoverTip" role="tooltip" aria-hidden="true"></div>

<script>
(() => {
  const I18N = {
    fa: {
      username: 'نام کاربری',
      password: 'رمز عبور',

    lang = next === 'en' ? 'en' : 'fa';
    localStorage.setItem('ff_lang', lang);
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'fa' ? 'rtl' : 'ltr';
    const d = dict();

    document.querySelectorAll('[data-i18n]').forEach(el => {
      const k = el.getAttribute('data-i18n');
      if (d[k]) el.textContent = d[k];
    });
    document.querySelectorAll('[data-i18n-ph]').forEach(el => {
      const k = el.getAttribute('data-i18n-ph');
      if (d[k]) el.placeholder = d[k];
    });
    $('langBtn').textContent = d.lang_btn;
    $('loginLangBtn').textContent = d.lang_btn;

    // Update localized status filter option labels while keeping exact API filter values.
    const sf = $('statusFilter');
    Array.from(sf.options).forEach(opt => {
      if (!opt.value) opt.textContent = d.opt_all;
      else opt.textContent = d.statuses[opt.value] || opt.value;
    });

    if (lastStatusData) renderStatusData(lastStatusData);
    else {
      $('runStatePill').textContent = d.states.idle;
      $('logsBox').textContent = d.ready;
    }
    renderTable();
  }

  $('langBtn').addEventListener('click', () => applyLang(lang === 'fa' ? 'en' : 'fa'));
  $('loginLangBtn').addEventListener('click', () => applyLang(lang === 'fa' ? 'en' : 'fa'));

  // Floating hover/focus tooltip engine for all [data-tip] elements.
  const tipBox = $('hoverTip');
  let tipTarget = null;
  let tipTimer = null;

  function positionTip(el) {
    const r = el.getBoundingClientRect();
    const tr = tipBox.getBoundingClientRect();
    const pad = 10;
    let top = r.bottom + 8;
    if (top + tr.height > window.innerHeight - pad) {
      top = Math.max(pad, r.top - tr.height - 8);
    }
    let left = document.documentElement.dir === 'rtl' ? (r.right - tr.width) : r.left;
    if (left + tr.width > window.innerWidth - pad) left = window.innerWidth - tr.width - pad;
    if (left < pad) left = pad;
    tipBox.style.top = Math.round(top) + 'px';
    tipBox.style.left = Math.round(left) + 'px';
  }

  function showTip(el, overrideText, isMono) {
    const key = el.getAttribute('data-tip');
    const msg = overrideText !== undefined ? overrideText : (key && dict().tips[key]);
    if (!msg) return;
    tipTarget = el;
    clearTimeout(tipTimer);
    tipTimer = setTimeout(() => {
      tipBox.classList.toggle('mono-tip', !!isMono);
      tipBox.textContent = msg;
      tipBox.classList.add('visible');
      tipBox.setAttribute('aria-hidden', 'false');
      positionTip(el);
    }, overrideText !== undefined ? 40 : 60);
  }

  function hideTip() {
    clearTimeout(tipTimer);
    tipTarget = null;
    tipBox.classList.remove('visible', 'mono-tip');
    tipBox.setAttribute('aria-hidden', 'true');
  }

  function resolveTruncatedHover(target) {
    if (!target || !target.closest) return null;
    const cell = target.closest('td[data-full], .pill[data-full], #statusMsg');
    if (!cell) return null;
    const full = cell.id === 'statusMsg' ? cell.textContent : cell.getAttribute('data-full');
    if (!full || full === '-') return null;
    if (cell.scrollWidth > cell.clientWidth + 1) {
      return {el: cell, text: full, mono: cell.classList.contains('mono') || cell.id === 'statusMsg'};
    }
    return null;
  }

  document.addEventListener('mouseover', e => {
    const trunc = resolveTruncatedHover(e.target);
    if (trunc) {
      if (trunc.el !== tipTarget) showTip(trunc.el, trunc.text, trunc.mono);
      return;
    }
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) return;
    if (el !== tipTarget) showTip(el);
  });
  document.addEventListener('mouseout', e => {
    if (!tipTarget) return;
    const trunc = resolveTruncatedHover(e.relatedTarget);
    if (trunc && trunc.el === tipTarget) return;
    const rel = e.relatedTarget && e.relatedTarget.closest && e.relatedTarget.closest('[data-tip]');
    if (!rel || rel !== tipTarget) hideTip();
  });
  document.addEventListener('focusin', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) showTip(el);
  });
  document.addEventListener('focusout', hideTip);
  window.addEventListener('scroll', hideTip, true);

  async function api(path, opts = {}) {
    const reqOpts = Object.assign({}, opts);
    const headers = Object.assign({}, opts.headers || {}, {'X-Requested-With': 'fastly-finder'});
    if (reqOpts.body && typeof reqOpts.body === 'object') {
      headers['Content-Type'] = 'application/json';
      reqOpts.body = JSON.stringify(reqOpts.body);
    }
    reqOpts.credentials = 'same-origin';
    reqOpts.headers = headers;
    const r = await fetch(path, reqOpts);
    if (r.status === 401 && path !== '/api/login') {
      showLogin();
      throw new Error('unauthorized');
    }
    const text = await r.text();
    let data = {};
    try { data = text ? JSON.parse(text) : {}; } catch {}
    if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
    return data;
  }

  function clearPoll() {
    if (pollTimer) { clearTimeout(pollTimer); pollTimer = null; }
  }

  function schedulePoll(ms) {
    clearPoll();
    pollTimer = setTimeout(pollStatus, ms);
  }

  function showLogin() {
    $('appWrap').classList.add('hidden');
    $('loginWrap').classList.remove('hidden');
    clearPoll();
  }

  function showApp(user) {
    $('loginWrap').classList.add('hidden');
    $('appWrap').classList.remove('hidden');
    $('userLabel').textContent = user || 'admin';
    refreshFiles();
    loadResults('');
    pollStatus();
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('loginErr').textContent = '';
    try {
      const res = await api('/api/login', {
        method: 'POST',
        body: {user: $('loginUser').value.trim(), pass: $('loginPass').value}
      });
      $('loginPass').value = '';
      showApp(res.user);
    } catch (err) {
      $('loginErr').textContent = err.message;
    }
  });

  $('logoutBtn').addEventListener('click', async () => {
    try { await api('/api/logout', {method: 'POST'}); } catch {}
    showLogin();
  });

  document.querySelectorAll('.tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      $('panelDomain').classList.toggle('hidden', mode !== 'domain');
      $('panelGlobal').classList.toggle('hidden', mode !== 'global');
      $('panelHosts').classList.toggle('hidden', mode !== 'hosts');
    });
  });

  $('startBtn').addEventListener('click', async () => {
    const payload = {
      global: mode === 'global',
      domains: mode === 'domain' ? $('domainInput').value.split(/[\s,]+/).filter(Boolean) : [],
      hosts: mode === 'hosts' ? $('hostsInput').value.split(/\r?\n/).map(s => s.trim()).filter(Boolean) : [],
      seeds: Array.from(document.querySelectorAll('#seedChecks input:checked')).map(c => c.value),
      limit: parseInt($('limitInput').value || '0', 10) || 0,
      ct_entries: parseInt($('ctEntriesInput').value || '3000', 10) || 3000,
      dns_workers: parseInt($('dnsWorkersInput').value || '150', 10) || 150,
      http_workers: parseInt($('httpWorkersInput').value || '40', 10) || 40,
      with_www: $('withWWWCheck').checked,
      doh: $('dohCheck').checked,
      include_bgp: $('bgpCheck').checked,
      skip_probe: $('skipProbeCheck').checked,
      only_confirmed: $('onlyConfirmedCheck').checked,
      aaaa: true
    };
    if (payload.global && payload.seeds.length === 0) {
      alert(dict().err_no_seeds);
      return;
    }
    try {
      await api('/api/scan/start', {method: 'POST', body: payload});
      activeFile = '';
      $('savedFilesSelect').value = '';
      allFindings = [];
      renderTable();
      wasRunning = true;
      pollStatus();
    } catch (err) {
      alert(err.message);
    }
  });

  $('cancelBtn').addEventListener('click', async () => {
    try { await api('/api/scan/cancel', {method: 'POST'}); } catch (err) { alert(err.message); }
  });

  function renderStatusData(s) {
    const d = dict();
    $('startBtn').disabled = !!s.running;
    $('cancelBtn').disabled = !s.running;
    const rawState = s.state || 'idle';
    const pill = $('runStatePill');
    pill.textContent = d.states[rawState] || rawState;
    pill.className = 'pill ' + (s.running ? 'info' : rawState === 'completed' ? 'ok' : rawState === 'error' ? 'bad' : '');
    $('statusMsg').textContent = s.message || '';
    const pct = s.total > 0 ? Math.min(100, Math.round((s.done / s.total) * 100)) : (s.running ? 15 : (rawState === 'completed' ? 100 : 0));
    $('progressBar').style.width = pct + '%';
    if (Array.isArray(s.logs)) {
      $('logsBox').textContent = s.logs.join('\n') || d.ready;
      $('logsBox').scrollTop = $('logsBox').scrollHeight;
    }
    const c = s.counts || {};
    $('kpiConfirmed').textContent = c.confirmed || 0;
    $('kpiHidden').textContent = c.fastly_dns_headers_hidden || 0;
    $('kpiUnknown').textContent = c.unknown_domain || 0;
    $('kpiUnreach').textContent = c.dns_only_unreachable || 0;
    $('kpiCand').textContent = (s.candidates || 0) + ' / ' + (s.fastly_dns || 0);
  }

  async function pollStatus() {
    if (polling) return;
    polling = true;
    clearPoll();
    let nextDelay = 10000;
    try {
      const s = await api('/api/status');
      lastStatusData = s;
      renderStatusData(s);
      nextDelay = s.running ? 1500 : 10000;
      const finishedNew = !s.running && (wasRunning || (s.scan_id && s.scan_id !== lastLoadedScanID));
      if (finishedNew) {
        if (s.scan_id) lastLoadedScanID = s.scan_id;
        refreshFiles();
        if (!activeFile) loadResults('');
      }
      wasRunning = !!s.running;
    } catch {
      nextDelay = 5000;
    } finally {
      polling = false;
      if (!$('appWrap').classList.contains('hidden')) {
        schedulePoll(nextDelay);
      }
    }
  }

  async function refreshFiles() {
    try {
      const res = await api('/api/files');
      const sel = $('savedFilesSelect');
      const prev = sel.value;
      sel.innerHTML = '';
      const def = document.createElement('option');
      def.value = '';
      def.setAttribute('data-i18n', 'opt_current');
      def.textContent = dict().opt_current;
      sel.appendChild(def);
      (res.files || []).forEach(f => {
        const opt = document.createElement('option');
        opt.value = f.name;
        opt.textContent = f.name + ' (' + Math.round(f.size / 1024) + ' KB)';
        sel.appendChild(opt);
      });
      sel.value = prev;
      activeFile = sel.value;
    } catch {}
  }

  $('savedFilesSelect').addEventListener('change', e => {
    activeFile = e.target.value;
    loadResults(activeFile);
  });

  async function loadResults(file) {
    try {
      const q = file ? ('?file=' + encodeURIComponent(file)) : '';
      const res = await api('/api/results' + q);
      allFindings = res.findings || [];
      renderTable();
    } catch {}
  }

  function statusPill(st) {
    const span = document.createElement('span');
    const label = dict().statuses[st] || st;
    span.textContent = label;
    span.setAttribute('data-full', label);
    const cls = st === 'confirmed' ? 'ok' : st === 'unknown_domain' ? 'warn' : st === 'dns_only_unreachable' ? 'bad' : 'info';
    span.className = 'pill ' + cls;
    return span;
  }

  function renderTable() {
    const q = $('searchInput').value.trim().toLowerCase();
    const stFilter = $('statusFilter').value;
    const sniOnly = $('sniOnlyCheck').checked;
    const tbody = $('resultsBody');
    tbody.innerHTML = '';

    const rows = allFindings.filter(f => {
      if (stFilter && f.status !== stFilter) return false;
      if (sniOnly && !f.edge_sni_cert_match) return false;
      if (!q) return true;
      const hay = [
        f.host, f.status, dict().statuses[f.status] || '',
        (f.fastly_ips || []).join(' '),
        (f.fastly_cnames || []).join(' '),
        (f.fastly_headers && f.fastly_headers['X-Served-By']) || '',
        f.tls_issuer || '',
        (f.sources || []).join(' ')
      ].join(' ').toLowerCase();
      return hay.includes(q);
    });

    const frag = document.createDocumentFragment();
    rows.slice(0, 1000).forEach(f => {
      const tr = document.createElement('tr');
      const cells = [
        {text: f.host, cls: 'mono'},
        {node: statusPill(f.status)},
        {text: f.http_status ? String(f.http_status) : '-', cls: 'mono'},
        {text: f.edge_sni_cert_match ? 'true' : 'false', cls: 'mono'},
        {text: (f.fastly_ips && f.fastly_ips.length ? f.fastly_ips.join(', ') : '-'), cls: 'mono'},
        {text: (f.fastly_cnames && f.fastly_cnames.length ? f.fastly_cnames.join(', ') : '-'), cls: 'mono'},
        {text: (f.fastly_headers && f.fastly_headers['X-Served-By']) || '-', cls: 'mono'},
        {text: f.tls_issuer || '-', cls: 'ltr-cell'},
        {text: (f.sources && f.sources.length ? f.sources.join(', ') : '-'), cls: 'mono'}
      ];
      cells.forEach(c => {
        const td = document.createElement('td');
        if (c.cls) td.className = c.cls;
        if (c.node) td.appendChild(c.node);
        else {
          td.textContent = c.text;
          td.setAttribute('data-full', c.text);
        }
        tr.appendChild(td);
      });
      tr.addEventListener('click', () => {
        $('detailTitle').textContent = f.host;
        $('detailJson').textContent = JSON.stringify(f, null, 2);
        $('detailModal').classList.remove('hidden');
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);
    const notice = $('tableNotice');
    if (rows.length > 1000) {
      notice.textContent = dict().trunc_notice(1000, rows.length);
      notice.classList.remove('hidden');
    } else {
      notice.textContent = '';
      notice.classList.add('hidden');
    }
  }

  $('searchInput').addEventListener('input', renderTable);
  $('statusFilter').addEventListener('change', renderTable);
  $('sniOnlyCheck').addEventListener('change', renderTable);

  document.querySelectorAll('button[data-exp]').forEach(btn => {
    btn.addEventListener('click', () => {
      const params = new URLSearchParams({format: btn.dataset.exp});
      if (activeFile) params.set('file', activeFile);
      if ($('onlyConfirmedCheck').checked) params.set('only_confirmed', '1');
      window.location = '/api/export?' + params.toString();
    });
  });

  $('closeModalBtn').addEventListener('click', () => $('detailModal').classList.add('hidden'));
  $('detailModal').addEventListener('click', e => { if (e.target === $('detailModal')) $('detailModal').classList.add('hidden'); });

  applyLang(lang);
  api('/api/me').then(me => showApp(me.user)).catch(showLogin);
})();
</script>
</body>
</html>
